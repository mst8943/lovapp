<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b090d">
  <title>Lovask · Çevrimdışı</title>
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:28px;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#431526,#0b090d 48%);color:#f5edf0;font:16px/1.55 system-ui,sans-serif;text-align:center}.card{width:min(100%,390px);padding:34px 26px;border:1px solid #d8b56c45;border-radius:28px;background:#151116e8;box-shadow:0 28px 80px #0008}.mark{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:20px 12px;background:linear-gradient(145deg,#e4c77f,#a8782d);color:#1b1116;font-size:30px;transform:rotate(-7deg)}h1{margin:22px 0 8px;font:600 38px/1.05 Georgia,serif}p{margin:0;color:#b8abb2}button{min-width:180px;min-height:48px;margin-top:25px;border:1px solid #cf5573;border-radius:15px;background:linear-gradient(145deg,#b72c51,#6f142d);color:white;font-weight:750}
  </style>
</head>
<body><main class="card"><div class="mark" aria-hidden="true">♥</div><h1>Bağlantını bekliyoruz.</h1><p>Lovask verilerini cihazda saklamaz. Yeniden bağlandığında kaldığın yerden devam edebilirsin.</p><button type="button" onclick="location.reload()">Tekrar dene</button></main></body>
</html>
